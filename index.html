<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>YouTube Live View Counter</title>
  <style>
    body {
      margin: 0;
      padding: 20px;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #0f0f0f;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 90vh;
    }

    .input-container {
      margin-bottom: 25px;
      display: flex;
      gap: 10px;
    }

    input[type="text"] {
      padding: 10px 15px;
      border-radius: 20px;
      border: 1px solid #333;
      background-color: #222;
      color: #fff;
      font-size: 14px;
      outline: none;
      width: 220px;
    }

    button {
      padding: 10px 20px;
      border-radius: 20px;
      border: none;
      background-color: #cc0000;
      color: #fff;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }

    button:hover {
      background-color: #ff0000;
    }

    .video-title {
      font-size: 18px;
      font-weight: 600;
      color: #aaa;
      margin-bottom: 15px;
      text-align: center;
      max-width: 90%;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* --- SLIDING ODOMETER STYLES --- */
    .ticker-container {
      display: flex;
      align-items: center;
      /* Scales font dynamically based on window width (min 28px, preferred 8vw, max 72px) */
      font-size: clamp(28px, 8vw, 72px); 
      font-weight: bold;
      line-height: 1em;
      height: 1em;
      overflow: hidden;
    }

    .digit-slot {
      display: inline-block;
      height: 1em;
      overflow: hidden;
      position: relative;
    }

    .digit-strip {
      display: flex;
      flex-direction: column;
      transition: transform 1s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .digit-strip span {
      display: block;
      height: 1em;
      line-height: 1em;
      text-align: center;
    }

    .separator {
      display: inline-block;
      height: 1em;
      line-height: 1em;
    }

    .status {
      margin-top: 15px;
      font-size: 12px;
      color: #666;
    }
  </style>
</head>
<body>

  <div class="input-container">
    <input type="text" id="videoIdInput" placeholder="Enter Video ID" value="dQw4w9WgXcQ">
    <button id="trackBtn">Track</button>
  </div>

  <div class="video-title" id="videoTitle">Enter a Video ID</div>
  
  <!-- Container where rolling digits are generated -->
  <div id="counter" class="ticker-container"></div>

  <div class="status" id="statusText">Polling every 5s...</div>

  <script src="renderer.js"></script>
</body>
</html>
